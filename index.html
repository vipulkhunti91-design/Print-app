<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Title & SEO Meta Tags -->
    <title>Phtopy - Campus Smart Printing</title>
    <meta name="title" content="Phtopy - Campus Smart Printing" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn Preview Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Phtopy" />

    <meta property="og:description" content="Instant campus document printing with zero wait. Upload files, customize print settings, track live queue, and pick up with your digital token." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:image:secure_url" content="%BASE_URL%og-image.png" />

    <meta property="og:image:height" content="630" />

    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card Preview Tags -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

  </head>
  <body>
    <!-- figma:body-start -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('printq_language_preference');
          var chosen = (saved === 'gu' || saved === 'hi' || saved === 'en') ? saved : 'en';
          window.language = chosen;
        } catch (e) {
          window.language = 'en';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
