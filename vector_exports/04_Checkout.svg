  <text x="60" y="695" fill="#F2F3F7" font-family="Inter, sans-serif" font-size="13" font-weight="600">Pay at Counter</text>
  <text x="60" y="713" fill="#A3A9B8" font-family="Inter, sans-serif" font-size="11.5">Pay cash or UPI scan when collecting printout</text>

