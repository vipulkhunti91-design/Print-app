  <rect x="0" y="748" width="390" height="96" fill="#171717" stroke="rgba(255,255,255,0.1)"/>
  <text x="20" y="784" fill="#A3A9B8" font-family="Inter, sans-serif" font-size="12">Total Price</text>
  <text x="20" y="810" fill="#F4D779" font-family="Inter, sans-serif" font-size="22" font-weight="800">₹242.00</text>
  <rect x="160" y="768" width="214" height="48" rx="12" fill="#F4D779"/>
  <text x="190" y="798" fill="#1A1405" font-family="Inter, sans-serif" font-size="14" font-weight="800">Confirm &amp; Pay →</text>
